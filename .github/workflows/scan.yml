name: IG viral scan

# Checks every 15 minutes for Telegram commands. A full scan only runs when it's due
# (set with /every in Telegram) or when you send /scan or /add.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # "Run workflow" button = scan now

permissions:
  contents: write

concurrency:
  group: ig-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read Telegram commands
        id: check
        run: python scan.py --commands-only

      - name: Install OCR
        if: steps.check.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr
          pip install -q -r requirements.txt

      - name: Scan
        if: steps.check.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: python scan.py

      - name: Save results
        if: always()
        run: |
          git config user.name "ig-scan-bot"
          git config user.email "ig-scan-bot@users.noreply.github.com"
          git add docs/data.json state/state.json config.json accounts.txt
          git diff --cached --quiet || git commit -q -m "scan $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase && git push -q
